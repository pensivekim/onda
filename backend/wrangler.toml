name = "onda-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "onda-db"
database_id = "placeholder"

[[kv_namespaces]]
binding = "LOCATION_KV"
id = "placeholder"

[[r2_buckets]]
binding = "CERT_BUCKET"
bucket_name = "onda-certs"

[vars]
FRONTEND_URL = "https://onda.genomic.cc"
